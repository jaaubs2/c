<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ====================================================================
       MÉTADONNÉES  [PLACEHOLDER — à affiner]
       ==================================================================== -->
  <title>[PLACEHOLDER] Nom de l'artisan — Ébéniste · Mobilier &amp; agencements sur-mesure</title>
  <meta
    name="description"
    content="[PLACEHOLDER] Portfolio one-page — ébéniste créateur de mobilier et d'agencements sur-mesure en bois massif (chêne, noyer, frêne). La matière, l'assemblage, le geste d'atelier."
  />
  <meta name="theme-color" content="#EAE5DD" />

  <!-- ====================================================================
       POLICES — Google Fonts
       Fraunces (display) · Inter Tight (sans) · Space Mono (mono)
       ==================================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter+Tight:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <!-- ====================================================================
       STYLES — tokens (variables) puis base (reset + globaux)
       ==================================================================== -->
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />

  <!-- ====================================================================
       LIBS — via CDN (aucune installation, aucun build)
       Lenis (smooth scroll) — feuille de style optionnelle de la lib
       ==================================================================== -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/lenis@1.1.14/dist/lenis.css"
  />
</head>

<body>
  <!-- Lien d'évitement (accessibilité clavier) -->
  <a class="skip-link" href="#hero">Aller au contenu</a>

  <!-- ====================================================================
       HEADER / NAVIGATION
       [PLACEHOLDER] — structure à concevoir (logo-nom + menu ancres)
       ==================================================================== -->
  <header class="site-header">
    <div class="wrap">
      <!-- [PLACEHOLDER] Nom / monogramme de l'ébéniste -->
      <!-- [PLACEHOLDER] Navigation : Réalisations · Savoir-faire · À propos · Contact -->
    </div>
  </header>

  <!-- ====================================================================
       CONTENU PRINCIPAL
       Les sections ci-dessous sont des ANCRES VIDES commentées.
       On les construira une par une, dans les prochaines étapes.
       ==================================================================== -->
  <main id="contenu">

    <!-- ---------------------------------------------------------------- -->
    <!-- HERO — accroche d'ouverture                                      -->
    <!-- ---------------------------------------------------------------- -->
    <section id="hero" aria-label="Introduction">
      <!-- [PLACEHOLDER] Hero : nom de l'ébéniste, métier, phrase d'accroche -->
    </section>

    <!-- ---------------------------------------------------------------- -->
    <!-- RÉALISATIONS — pièces de mobilier & agencements sur-mesure       -->
    <!-- ---------------------------------------------------------------- -->
    <section id="realisations" aria-label="Réalisations">
      <!-- [PLACEHOLDER] Grille / liste éditoriale de pièces de mobilier et d'agencements -->
    </section>

    <!-- ---------------------------------------------------------------- -->
    <!-- SAVOIR-FAIRE — essences, assemblages, atelier                    -->
    <!-- ---------------------------------------------------------------- -->
    <section id="savoir-faire" aria-label="Savoir-faire">
      <!-- [PLACEHOLDER] Les essences (chêne, noyer, frêne), les assemblages, le geste d'atelier -->
    </section>

    <!-- ---------------------------------------------------------------- -->
    <!-- À PROPOS — bio de l'artisan                                      -->
    <!-- ---------------------------------------------------------------- -->
    <section id="a-propos" aria-label="À propos">
      <!-- [PLACEHOLDER] Portrait & parcours de l'ébéniste, sa démarche -->
    </section>

    <!-- ---------------------------------------------------------------- -->
    <!-- CONTACT                                                          -->
    <!-- ---------------------------------------------------------------- -->
    <section id="contact" aria-label="Contact">
      <!-- [PLACEHOLDER] Prise de contact, coordonnées, atelier -->
    </section>

  </main>

  <!-- ====================================================================
       FOOTER
       [PLACEHOLDER] — mentions, réseaux, crédit
       ==================================================================== -->
  <footer class="site-footer">
    <div class="wrap">
      <!-- [PLACEHOLDER] Pied de page -->
    </div>
  </footer>

  <!-- ====================================================================
       SCRIPTS — ordre important :
       GSAP → ScrollTrigger → Lenis (lib) → lenis.js (init) → main.js
       Tous en `defer` : exécutés après le parsing du DOM, dans l'ordre.
       ==================================================================== -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script defer src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
  <script defer src="assets/js/lenis.js"></script>
  <script defer src="assets/js/main.js"></script>
</body>
</html>
